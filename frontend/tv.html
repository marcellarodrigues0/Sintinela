<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sistema Hospitalar - TV</title>

<style>


/* =========================================================
   SENTINELA — PAINEL DE TV
   HOSPITAL MODERNO DARK
========================================================= */

:root {
    --fundo: #070c13;
    --painel: #101b29;
    --painel-secundario: #0c1521;
    --borda: #263b53;

    --azul: #1677ff;
    --azul-claro: #63adff;

    --branco: #f3f7ff;
    --texto-suave: #a9bdd5;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    width: 100%;
    padding: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    color: var(--branco);

    background:
        radial-gradient(
            circle at top right,
            rgba(22, 119, 255, 0.13),
            transparent 38%
        ),
        var(--fundo);
}

/* =========================================================
   CONTAINER DA TV
========================================================= */

.tv-container {
    display: flex;
    width: 96vw;
    height: 92vh;
    gap: 18px;
}

/* =========================================================
   PAINÉIS
========================================================= */

.left-panel,
.right-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
}

.left-panel {
    width: 32%;
}

.right-panel {
    width: 68%;
}

/* =========================================================
   CARTÕES
========================================================= */

.box {
    position: relative;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-width: 0;
    overflow: hidden;
    text-align: center;

    background: linear-gradient(
        145deg,
        var(--painel),
        var(--painel-secundario)
    );

    border: 1px solid var(--borda);
    border-radius: 18px;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
}

/* Linha azul superior */

.box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--azul),
        var(--azul-claro),
        transparent
    );

    opacity: 0.85;
}

/* =========================================================
   TÍTULOS
========================================================= */

.box-title {
    margin-bottom: 16px;

    color: var(--azul-claro);

    font-size: clamp(16px, 1.7vw, 28px);
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: 2px;
}

/* =========================================================
   LOCAL DA CHAMADA
========================================================= */

.local-box {
    flex: 1;
    padding: 20px;
}

.local-number {
    color: var(--branco);

    font-size: clamp(64px, 8vw, 130px);
    font-weight: 800;

    line-height: 1;

    text-shadow:
        0 0 28px rgba(22, 119, 255, 0.24);
}

.local-type {
    margin-top: 12px;

    color: var(--texto-suave);

    font-size: clamp(15px, 1.6vw, 25px);
    font-weight: 700;
    letter-spacing: 2px;
}

/* =========================================================
   HISTÓRICO DE CHAMADAS
========================================================= */

.history-box {
    flex: 1;

    justify-content: flex-start;
    align-items: flex-start;

    padding: 24px;
}

.history-box .box-title {
    align-self: center;
    margin-bottom: 24px;

    font-size: clamp(14px, 1.4vw, 23px);
    text-align: center;
}

#history-list {
    width: 100%;
    list-style: none;

    color: var(--texto-suave);

    font-size: clamp(13px, 1.2vw, 20px);
    font-weight: 600;
    text-align: left;
}

#history-list li {
    margin-bottom: 12px;
    padding: 12px 10px;

    overflow-wrap: anywhere;

    background: rgba(22, 119, 255, 0.055);

    border: 1px solid rgba(38, 59, 83, 0.7);
    border-radius: 8px;

    border-left: 3px solid var(--azul);
}

/* =========================================================
   PACIENTE CHAMADO
========================================================= */

.patient-box {
    flex: 3;
    padding: 25px;
}

.patient-box .box-title {
    margin-bottom: 25px;
}

.patient-name {
    width: 100%;
    padding: 20px;

    color: var(--branco);

    font-size: clamp(30px, 5.5vw, 88px);
    font-weight: 800;

    line-height: 1.2;

    overflow-wrap: anywhere;
    word-break: normal;

    text-shadow:
        0 0 35px rgba(22, 119, 255, 0.18);
}

/* =========================================================
   LOGO DO HOSPITAL
========================================================= */

.logo-box {
    flex: 1;

    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;

    gap: 18px;
    padding: 15px;
}

.tv-logo {
    width: clamp(42px, 4.5vw, 70px);
    height: clamp(42px, 4.5vw, 70px);

    object-fit: contain;
}

.logo-text {
    color: var(--branco);

    font-size: clamp(20px, 2.2vw, 36px);
    font-weight: 800;

    letter-spacing: 1px;
    white-space: nowrap;
}

/* =========================================================
   ANIMAÇÃO DE NOVA CHAMADA
   Mantém a classe .flash usada pelo JavaScript
========================================================= */

@keyframes flash {
    0%,
    100% {
        opacity: 1;
        transform: scale(1);
        border-color: var(--borda);
    }

    50% {
        opacity: 0.75;
        transform: scale(1.015);
        border-color: var(--azul-claro);
        box-shadow:
            0 0 30px rgba(22, 119, 255, 0.3);
    }
}

.flash {
    animation: flash 0.5s ease 3;
}

/* =========================================================
   TELAS MENORES
========================================================= */

@media (max-width: 900px) {
    body {
        padding: 12px;
        overflow: auto;
    }

    .tv-container {
        flex-direction: column;

        width: 100%;
        height: auto;
        min-height: 95vh;
    }

    .left-panel,
    .right-panel {
        width: 100%;
    }

    .left-panel {
        flex-direction: row;
        min-height: 220px;
    }

    .local-box,
    .history-box {
        flex: 1;
        min-width: 0;
        padding: 16px;
    }

    .local-number {
        font-size: clamp(48px, 9vw, 80px);
    }

    .local-type {
        font-size: 14px;
    }

    .history-box .box-title {
        letter-spacing: 1px;
    }

    #history-list {
        font-size: 13px;
    }

    #history-list li {
        padding: 8px;
        margin-bottom: 7px;
    }

    .patient-box {
        flex: none;
        min-height: 300px;
    }

    .patient-name {
        font-size: clamp(30px, 7vw, 60px);
    }

    .logo-box {
        min-height: 100px;
    }
}

@media (max-width: 480px) {
    .left-panel {
        flex-direction: column;
    }

    .local-box {
        min-height: 180px;
    }

    .history-box {
        min-height: 180px;
    }

    .patient-box {
        min-height: 250px;
    }

    .logo-box {
        gap: 10px;
    }
}

</style>

</head>


<body>


<div class="tv-container">


    <!-- PAINEL ESQUERDO -->

    <div class="left-panel">


        <!-- LOCAL -->

        <div class="box local-box">

            <div
                class="box-title"
                id="local-tipo"
            >
                GUICHÊ
            </div>


            <div
                class="local-number"
                id="local-numero"
            >
                --
            </div>


        </div>


        <!-- HISTÓRICO -->

        <div class="box history-box">

            <div class="box-title">
                ÚLTIMAS CHAMADAS
            </div>


            <ul id="history-list"></ul>

        </div>


    </div>


    <!-- PAINEL DIREITO -->

    <div class="right-panel">


        <!-- PACIENTE -->

        <div class="box patient-box">

            <div class="box-title">
                PACIENTE
            </div>


            <div
                class="patient-name"
                id="patient-name"
            >
                AGUARDANDO...
            </div>

        </div>


        <!-- LOGO -->

       <div class="box logo-box">

    <img 
        src="logo ospital.png" 
        alt="Logo Hospital"
        class="tv-logo"
    >

    <div class="logo-text">
        VidasSalvas
    </div>

</div>


    </div>


</div>


<script>

let ultimoId = null;


/* =========================================================
   ATUALIZAR TV
========================================================= */

function atualizar() {

    fetch("/tv/chamada")

    .then(r => r.json())

    .then(data => {

        const chamada =
            data.chamada;

        const historico =
            data.historico || [];


        if (chamada) {


            document.getElementById(
                "local-tipo"
            ).innerText =
                chamada.localTipo ||
                "GUICHÊ";


            document.getElementById(
                "local-numero"
            ).innerText =
                chamada.localNumero ||
                "--";


            document.getElementById(
                "patient-name"
            ).innerText =
                chamada.paciente ||
                "AGUARDANDO...";


            /* Flash quando existe nova chamada */

            if (chamada.id !== ultimoId) {

                ultimoId =
                    chamada.id;


                const patientBox =
                    document.querySelector(
                        ".patient-box"
                    );


                patientBox.classList.remove(
                    "flash"
                );


                void patientBox.offsetWidth;


                patientBox.classList.add(
                    "flash"
                );

            }

        }


        /* =================================================
           HISTÓRICO
        ================================================= */

        const list =
            document.getElementById(
                "history-list"
            );


        list.innerHTML = "";


        historico
            .slice(0, 4)
            .forEach(h => {


                const li =
                    document.createElement(
                        "li"
                    );


                const tipo =
                    h.localTipo
                        ? h.localTipo.substring(
                            0,
                            4
                        )
                        : "GUIC";


                li.innerText =
                    `${tipo}.${h.localNumero} - ${h.paciente}`;


                list.appendChild(li);

            });

    })

    .catch(err => {

        console.log(
            "Erro ao buscar chamada:",
            err
        );

    });

}


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
========================================================= */

atualizar();

setInterval(
    atualizar,
    2000
);

</script>


</body>

</html>
